services:
  frontend:
    # Placeholder: replace with a Nuxt build once the application exists.
    image: nginx:alpine
    ports:
      - "127.0.0.1:3000:80"

  backend:
    # Placeholder: replace with a FastAPI build once the application exists.
    image: nginx:alpine
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  collector:
    image: alpine:3.21
    command: ["sleep", "infinity"]
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Private development setup. Enable authentication/TLS before public use.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    # No host port: Elasticsearch is accessible only within the Compose network.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  kibana:
    # Keep this version identical to Elasticsearch.
    image: docker.elastic.co/kibana/kibana:9.5.6
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "127.0.0.1:5601:5601"
    volumes:
      - kibana-data:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  elasticsearch-data:
  kibana-data:
