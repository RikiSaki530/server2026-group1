services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NUXT_BACKEND_URL: http://backend:8000
      NUXT_PUBLIC_KIBANA_URL: ${NUXT_PUBLIC_KIBANA_URL:-http://localhost:5601}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      DEMO_MODE: ${DEMO_MODE:-false}
      NATURE_TOKEN: ${NATURE_TOKEN:-}
      COLLECTION_INTERVAL_SECONDS: ${COLLECTION_INTERVAL_SECONDS:-300}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s
    depends_on:
      elasticsearch:
        condition: service_healthy

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    restart: unless-stopped
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NATURE_TOKEN: ${NATURE_TOKEN:-}
      COLLECTION_INTERVAL_SECONDS: ${COLLECTION_INTERVAL_SECONDS:-300}
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana-setup:
    build:
      context: .
      dockerfile: collector/Dockerfile
    command: ["python", "-m", "collector.setup_kibana"]
    environment:
      KIBANA_URL: http://kibana:5601
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      backend:
        condition: service_healthy
      kibana:
        condition: service_started

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Private development setup. Enable authentication/TLS before public use.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 2g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    # No host port: Elasticsearch is accessible only within the Compose network.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  kibana:
    # Keep this version identical to Elasticsearch.
    image: docker.elastic.co/kibana/kibana:9.5.6
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "127.0.0.1:5601:5601"
    volumes:
      - kibana-data:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  elasticsearch-data:
  kibana-data:
